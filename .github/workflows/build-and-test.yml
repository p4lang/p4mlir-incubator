name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel any preceding run on the pull request.
concurrency:
  group: p4mlir-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-licenses:
    runs-on: ubuntu-latest
    name: Validate that all files have copyright and license info
    steps:
      - uses: actions/checkout@v6
      - name: Install dev dependencies
        run: |
          ./tools/install-uv.sh
      - name: Validate presence of copyright and license info (python w/reuse)
        run: |
          uvx reuse lint
  build-and-test:
    name: test-${{ matrix.distribution }}${{ matrix.nix && '-nix' || '' }}
    runs-on: ${{ matrix.distribution }}
    strategy:
      fail-fast: false  # Let all matrix jobs complete, even if one fails
      matrix:
        include:
          - distribution: ubuntu-22.04
          - distribution: ubuntu-24.04
          # Same build, with the requirements provided by the Nix dev shell
          # (flake.nix) instead of the Ubuntu install script.
          - distribution: ubuntu-24.04
            nix: true
    defaults:
      run:
        # The Nix entry runs every step inside the dev shell. `bash -e {0}` is
        # what GitHub uses when no shell is specified, so the other entries are
        # unchanged.
        shell: ${{ matrix.nix && 'nix develop --command bash -e {0}' || 'bash -e {0}' }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      if: ${{ matrix.nix }}
      uses: cachix/install-nix-action@v31

    - name: Get LLVM hash
      id: get-llvm-hash
      run: echo "hash=$(git rev-parse @:./third_party/llvm-project)" >> $GITHUB_OUTPUT

    # Identifies the toolchain in the cache keys below: the distribution for an
    # apt-provided toolchain, or the Nix flake for a Nix-provided one, since a
    # cached LLVM build is only valid for the exact toolchain that produced it.
    - name: Get toolchain id
      id: get-toolchain-id
      run: echo "id=${{ matrix.nix && format('nix-{0}', hashFiles('flake.nix', 'flake.lock')) || matrix.distribution }}" >> "$GITHUB_OUTPUT"

    - name: Enable ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        # The ccache key combines runner OS and distribution, LLVM version, and build configuration to prevent unsafe cache hits while maximizing valid reuse.
        # ccache key components:
        # - ${{ steps.get-llvm-hash.outputs.hash }}
        #   - Pins cache to the exact LLVM commit. Without this, a cache hit could return incompatible build results.
        # - hashFiles('${{ github.workspace }}/build_tools/build_mlir.sh')
        #   - The build_mlir.sh script defines critical build flags (e.g., -DLLVM_ENABLE_RTTI=ON, compiler choices, linker options).
        #     If the script changes (e.g., enabling/disabling features), cached objects from a previous version might be invalid or unsafe to reuse.
        key: ${{ runner.os }}-${{ steps.get-toolchain-id.outputs.id }}-llvm-commit-${{ steps.get-llvm-hash.outputs.hash }}-mlir-build-script-${{ hashFiles('${{ github.workspace }}/build_tools/build_mlir.sh') }}
        max-size: 2G
    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@v3
      with:
        path: |
          third_party/llvm-project/build/bin/llvm-lit
          install
        key: ${{ runner.os }}-${{ steps.get-toolchain-id.outputs.id }}-llvm-commit-${{ steps.get-llvm-hash.outputs.hash }}-mlir-build-script-${{ hashFiles('${{ github.workspace }}/build_tools/build_mlir.sh') }}

    - name: Install requirements
      if: ${{ !matrix.nix }}
      run: |
        build_tools/ubuntu_install_mlir_requirements.sh

    # --------
    # Build and test MLIR. Use cache when available.
    # --------

    - name: Build and test MLIR
      if: steps.cache-llvm.outputs.cache-hit != 'true'
      run: |
        build_tools/build_mlir.sh

    # --------
    # Build and test P4MLIR.
    # --------

    - name: Build and test P4MLIR
      run: |
        build_tools/build_p4c_with_p4mlir_ext.sh
